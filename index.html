const LABEL = {alerted:"✅ 알림", dropped:"드랍", pending:"⏳ 대기", error:"오류"};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pct(v,s){return v==null?"n/a":(v>0?"+":"")+v.toFixed(1)+(s||"%")}
function cls(v){return v==null?"":(v>0?"pos":v<0?"neg":"")}
function chip(r){
 return `<span class="chip ${r.pass?"hit":""}">${esc(r.label)} · 매출 <b class="${cls(r.rev_g)}">${pct(r.rev_g)}</b> · 영업이익 <b class="${cls(r.op_g)}">${pct(r.op_g)}</b> · GPM ${r.gpm_p.toFixed(1)}→${r.gpm_c.toFixed(1)} <b class="${cls(r.gpm_d)}">(${pct(r.gpm_d,"%p")})</b></span>`}
function bkchip(bk){
 const uk = v => (v/1e8).toLocaleString(undefined,{maximumFractionDigits:0});
 return `<span class="chip ${bk.pass?"hit":""}">📦 수주잔고(${esc(bk.basis||"직전보고서 대비")}) · ${uk(bk.prev)}억 → ${uk(bk.cur)}억 <b class="${cls(bk.growth)}">(${pct(bk.growth)})</b></span>`}
function fmtAmt(v){
 return Math.abs(v)>=1e12 ? (v/1e12).toLocaleString(undefined,{maximumFractionDigits:1})+"조"
                          : Math.round(v/1e8).toLocaleString()+"억"}
function provchips(p){
 if(!p) return "";
 let out = "";
 for(const [k,nm] of [["rev","매출"],["op","영업이익"]]){
  const d = p[k];
  if(!d) continue;
  const cmp = [["qoq","QoQ"],["yoy","YoY"]].filter(([f])=>d[f]!=null)
    .map(([f,l])=>`${l} <b class="${cls(d[f])}">${pct(d[f])}</b>`).join(" · ");
  const opm = (k==="op"&&p.opm!=null)?` · OPM ${p.opm.toFixed(1)}%`:"";
  out += `<span class="chip hit">${nm} ${fmtAmt(d.amt)}${cmp?" · "+cmp:""}${opm}</span>`;
 }
 return out}
function card(h){
 const dart = "https://dart.fss.or.kr/dsaf001/main.do?rcpNo=" + h.rcept_no;
 const reason = h.reason ? ` · ${esc(h.reason)}` : "";

 return `<div class="card"><div class="row1">
  <a class="corp" href="${dart}" target="_blank">${esc(h.corp)}</a>
  <span class="code">${esc(h.stock)} ${MARKET[h.market]||""}</span>

  <span class="badge b-${h.status}">${LABEL[h.status]||h.status}${h.status!=="alerted"?reason:""}</span>
 </div>${chips?`<div class="bases">${chips}</div>`:""}</div>`}
function lastProv(code){
 const provs = Object.values(DATA).filter(h => h.stock===code && (h.report||"").includes("잠정"))
   .sort((a,b) => b.rcept_dt.localeCompare(a.rcept_dt));
 return provs[0] || null;
}
function renderWL(){
 const codes = Object.keys(WL).filter(c => {
  const nm = (WL[c].name||"").toLowerCase();
  return !q || nm.includes(q);
 });
 // 최근 잠정실적 있는 종목 먼저, 그 안에서 최신순 → 나머지는 이름순
 codes.sort((a,b) => {
  const pa = lastProv(a), pb = lastProv(b);
  if (!!pa !== !!pb) return pa ? -1 : 1;
  if (pa && pb) return pb.rcept_dt.localeCompare(pa.rcept_dt);
  return (WL[a].name||"").localeCompare(WL[b].name||"");
 });
 let html = `<div class="day">워치리스트 ${Object.keys(WL).length}종목 — 잠정실적 공시가 뜨면 조건 없이 채널 알림</div>`;
 for (const code of codes){
  const info = WL[code], p = lastProv(code);
  const dart = p ? `https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${p.rcept_no}` : `https://finance.naver.com/item/main.naver?code=${code}`;
  const when = p ? `${p.rcept_dt.slice(2,4)}.${p.rcept_dt.slice(4,6)}.${p.rcept_dt.slice(6,8)} 잠정` : "이번 분기 잠정공시 없음";
  html += `<div class="card"><div class="row1">
   <a class="corp" href="${dart}" target="_blank">${esc(info.name)}</a>
   <span class="code">${code}</span>
   <span class="meta">출처: ${esc(info.src||"-")} · ${when}</span>
  </div>${p&&p.prov?`<div class="bases">${provchips(p.prov)}</div>`:""}</div>`;
 }
 document.getElementById("list").innerHTML = html;
}
function render(){
 const all = Object.values(DATA);
 for (const s of ["alerted","dropped","pending","error"])
  document.getElementById("t-"+s).textContent = all.filter(h=>h.status===s).length;
 document.getElementById("t-all").textContent = all.length;
 if (filter === "wl"){ renderWL(); return; }
 const rows = all
  .filter(h => filter==="all" || h.status===filter)
  .filter(h => !q || h.corp.toLowerCase().includes(q))
  .sort((a,b) => (b.rcept_dt+b.ts).localeCompare(a.rcept_dt+a.ts));
 let html = "", day = "";
 for (const h of rows){
  const d = h.rcept_dt ? `${h.rcept_dt.slice(0,4)}.${h.rcept_dt.slice(4,6)}.${h.rcept_dt.slice(6,8)}` : "날짜미상";
  if (d !== day){ day = d; html += `<div class="day">${d} 공시</div>`; }
  html += card(h);
 }
 document.getElementById("list").innerHTML = html || `<div class="empty">표시할 공시가 없습니다</div>`;
}
document.getElementById("filters").addEventListener("click", e=>{
 if(!e.target.dataset.f) return;
 filter = e.target.dataset.f;
 document.querySelectorAll("#filters .pill[data-f]").forEach(b=>b.classList.toggle("on", b.dataset.f===filter));
 render();
});
document.getElementById("q").addEventListener("input", e=>{q=e.target.value.trim().toLowerCase();render()});
render();
</script></body></html>
